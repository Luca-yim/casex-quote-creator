name: E2E

on:
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      E2E_DEBUG_AUTH: "true"
      # App project (NOT the Lovable Cloud project). Publishable values are public.
      VITE_APP_SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
      VITE_APP_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      VITE_APP_TURNSTILE_SITE_KEY: ${{ vars.E2E_TURNSTILE_SITE_KEY }}
      TEST_USER_REP_EMAIL: ${{ vars.TEST_USER_REP_EMAIL }}
      TEST_USER_EXTERNAL_EMAIL: ${{ vars.TEST_USER_EXTERNAL_EMAIL }}
      TEST_USER_ESTIMATOR_EMAIL: ${{ vars.TEST_USER_ESTIMATOR_EMAIL }}
      # Real credentials -> secrets.*, never vars.*
      TEST_USER_REP_PASSWORD: ${{ secrets.TEST_USER_REP_PASSWORD }}
      TEST_USER_EXTERNAL_PASSWORD: ${{ secrets.TEST_USER_EXTERNAL_PASSWORD }}
      TEST_USER_ESTIMATOR_PASSWORD: ${{ secrets.TEST_USER_ESTIMATOR_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium

      # Mints real sessions server-side with the service-role key. The public,
      # CAPTCHA-gated sign-in endpoints are never called, and the resulting
      # tokens are masked and scoped to this job only — never committed.
      - name: Mint E2E sessions
        env:
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
        run: bunx tsx e2e/scripts/mint-session.ts --github

      - name: Run Playwright
        run: bunx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
